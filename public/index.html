<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mark Sloboda</title>
<meta name="description" content="Mark Sloboda — founder of Blinner. Personal site, coming soon.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Georgia,serif' font-size='18' fill='%23fff'%3EM%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #fafaf7;
    --ink: #151515;
    --muted: #6b6b66;
    --line: #e6e4dd;
    --accent: #1f5f3a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111110; --ink: #f2f1ec; --muted: #9a9892; --line: #2a2926; --accent: #7fc69a; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 18px/1.6 -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100%;
  }
  main {
    flex: 1;
    display: flex;
    align-items: center;
    padding: 48px 16px;
  }
  .card { max-width: 560px; margin: 0 auto; width: 100%; }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: clamp(2.2rem, 6vw, 3.4rem);
    letter-spacing: -0.01em;
    line-height: 1.1;
    margin: 0 0 16px;
  }
  p { margin: 0 0 14px; color: var(--muted); }
  p.lead { color: var(--ink); font-size: 1.1em; }
  .links { display: flex; flex-wrap: wrap; gap: 10px 22px; margin-top: 28px; padding-top: 22px; border-top: 1px solid var(--line); }
  a { color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent; }
  a:hover { border-bottom-color: currentColor; }
  footer { padding: 20px 16px; font-size: 14px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Mark Sloboda</h1>
    <p class="lead">Founder of <a href="https://www.blinner.com">Blinner</a>, a meal-planning app for people who cook at home.</p>
    <p>The full site is on its way. Projects, writing, and what I'm working on now will live here.</p>
    <div class="links">
      <a href="https://www.blinner.com">Blinner</a>
      <a href="https://github.com/CRYPTOSLO">GitHub</a>
    </div>
  </div>
</main>
<footer>marksloboda.com</footer>
</body>
</html>
